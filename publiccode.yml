description:
  nl:
    shortDescription: >-
      Web components voor overheidsinterfaces, met de huisstijl,
      toegankelijkheid en het interactiegedrag ingebouwd.
    longDescription: >-
      Het NLDD Designsysteem levert de bouwstenen voor interfaces van de
      Nederlandse Digitale Dienst als web components. Knoppen, formuliervelden,
      lijsten, tabellen, navigatie, overlays en paginastructuren zitten erin,
      met de Rijkshuisstijl, de toegankelijkheidseisen en het verwachte
      toetsenbord- en schermlezergedrag al ingebakken. Een ontwikkelaar hoeft
      die regels dus niet uit het hoofd te kennen: wie een component plaatst,
      krijgt het juiste focusgedrag, de juiste kleurcontrasten en de juiste ARIA
      mee zonder er iets voor te doen.

      De componenten zijn gebouwd met Lit en werken in elk framework en in
      platte HTML, omdat ze de standaard custom elements van de browser
      gebruiken. Alle visuele waarden komen uit CSS-variabelen in vier lagen,
      wat licht- en donkerthema's mogelijk maakt en de huisstijl op één plek
      houdt. Het pakket wordt gepubliceerd op npm en de levende documentatie
      staat in Storybook.
    features:
      - Web components
      - Rijkshuisstijl
      - Toegankelijkheid
      - Formulieren
      - Licht- en donkerthema

