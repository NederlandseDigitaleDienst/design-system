name: Validate

on:
  pull_request:
  push:
    branches:
      - main

# Zie de toelichting in ci.yml: zonder dit blok draait deze workflow met de
# read-write repo-default, terwijl `cem analyze` en de vue-types-keten
# (tsc/vue-tsc) dependency-code uitvoeren.
permissions:
  contents: read

jobs:
  validate:
    name: Validate CSS Variables
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Zie ci.yml: anders blijft het token de hele job bereikbaar via de
          # git-config van deze checkout, terwijl de stappen hieronder
          # dependency-code uitvoeren. De `git diff --exit-code`-checks zijn
          # lokaal en hebben het credential niet nodig.
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      # --ignore-scripts: a hijacked dependency release must not get to run its
      # preinstall/postinstall hook in CI. Nothing below needs them.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Validate CSS variables
        run: npm run validate:styles

      # The full `npm run build` is the only other place this runs, and no PR
      # workflow executes that — so without this step the reset-hardening guard
      # could only fail at publish time on main.
      - name: Validate host styles against consumer resets
        run: npm run validate:host-styles

      - name: Test reference generator
        run: npm run test:scripts

      # The changelog skill fixes the order of the sections, Highlights first,
      # but a rule in prose was broken in half the blocks before this ran.
      - name: Validate changelog sections
        run: npm run validate:changelog

      # The drift check below compares generated output against generated
      # output, so it cannot see a property that never reached the JSDoc. This
      # one compares the other way round: from the @property decorators to the
      # @attr lines, so a new attribute cannot stay undocumented. Named slots
      # go the same way, from the render template to the @slot lines.
      - name: Validate component API documentation
        run: npm run validate:component-api

      # The two checks above only cover generated output and the JSDoc behind
      # it. SKILL.md, patterns/*.md and examples/*.md are hand-written, and
      # their code blocks are what consumers and agents copy, so a tag or
      # attribute that no longer exists is a bug we ship.
      - name: Validate hand-written skill markup
        run: npm run validate:skill-markup

      # The stories are documentation too, so they hold to the same rules.
      - name: Lint the stories
        run: npm run lint:stories

      # The marketing page in www/ is built from the components and goes
      # online as is, so it holds to the rules consumers get.
      - name: Lint the marketing page
        run: npm run lint:www

      # Every committed file a script writes, from the table in
      # scripts/generated-files.js: the producers run in the order of what they
      # read (the reference after the manifest), and each file that changed is
      # reported with the script that makes it. The skill changelog and
      # publiccode.yml are written by the release itself, so they are not here.
      - name: Check generated files are in sync
        run: npm run check:generated

      # Every example does what it claims, no selector names something that does
      # not exist, and every pattern passes. A rename fails here, in its own PR.
      - name: Check lint rules
        run: npm run lint:rules

      # Compiling a real Vue template and a real React component is the only
      # thing that proves the generated declarations are usable. Generating them
      # only proves a file was written: an earlier generator produced names Vue
      # never looks up, and every check short of this one stayed green. The
      # declarations reference the emitted .d.ts files, so those have to exist
      # first.
      #
      # build:icons runs first because the modules build (tsc) imports the
      # generated logo module, which is gitignored and so absent from a fresh
      # checkout. In a normal build the build:components chain generates it before
      # tsc; run in isolation here it has to be generated by hand.
      - name: Type-check the generated Vue and React declarations
        shell: bash
        run: |
          set -e
          npm run build:icons
          npm run build:components:modules
          npm run generate:vue-types
          npm run test:vue-types
          npm run generate:react-types
          npm run test:react-types
