name: CI
on:
  pull_request:
  push:
    branches:
      - main

# Zonder dit blok erft deze workflow de repo-default, en die staat op dit
# moment op read-write. Lint, tests, de componentbuild en `playwright install`
# voeren code van dependencies uit (vite, rollup, esbuild, de playwright-CLI,
# eslint- en vitest-plugins); --ignore-scripts sluit het install-moment af,
# niet dit. Zo'n job hoort geen token te hebben waarmee naar main gepusht kan
# worden.
permissions:
  contents: read

jobs:
  build-and-check:
    name: Build & Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Zonder dit laat actions/checkout het token achter als een credential
          # dat de git-config van deze checkout oplost, de hele job. Alles wat
          # daarna draait kan erbij, inclusief de dependency-code hieronder.
          # Geen enkele stap heeft dit credential nodig: de
          # `git diff --exit-code`-checks zijn lokaal, en de npm-cache van
          # setup-node en `playwright install` gebruiken het niet.
          persist-credentials: false
      # From .nvmrc, so CI runs the Node this project is developed on. It used to
      # be pinned here, drifted to 20 while .nvmrc said 24, and that gap showed
      # up as three dependabot PRs failing on both jobs at once: dependabot
      # regenerates package-lock.json with npm 11, which drops an optional
      # transitive entry that the npm 10 shipping with Node 20 then reports as
      # missing, so `npm ci` stopped before anything was built. A second place to
      # state the version is a second place for it to go stale.
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      # --ignore-scripts: a hijacked dependency release must not get to run its
      # preinstall/postinstall hook in CI. Nothing in this tree needs lifecycle
      # scripts at install time; the browsers come from the explicit
      # `playwright install` in the next step, which has always been required.
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run ESLint (including lit-a11y rules)
        run: npm run lint
      # The build excludes test files (tsconfig.build.json), so type errors in
      # tests only surface here. Kept at zero since 252b828 — keep it there.
      - name: Type-check, including test files
        run: npm run typecheck
      - name: Run unit tests
        run: npm run test:run
      - name: Build styles
        run: npm run build:styles
      - name: Build components
        run: npm run build:components
      - name: Verify exports map is up to date
        run: node scripts/generate-exports.js && git diff --exit-code package.json
      - name: Verify plugin manifests follow the package version
        run: npm run generate:plugin-version && git diff --exit-code .claude-plugin/ .cursor-plugin/
