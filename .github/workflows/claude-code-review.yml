name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  claude-review:
    if: ${{ !github.event.pull_request.draft && github.event.pull_request.user.login != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          use_sticky_comment: true
          # Force tag mode: the action creates the tracking comment that
          # mcp__github_comment__update_claude_comment updates. Without this the
          # workflow runs in agent mode, no comment id exists, and every
          # update_claude_comment call fails — the review is never posted.
          track_progress: true
          # Show the full execution transcript in the Actions log so a silent
          # run can be diagnosed instead of guessed at.
          show_full_output: true
          claude_args: "--allowedTools mcp__github_comment__update_claude_comment,mcp__github_inline_comment__create_inline_comment,Bash,Read,Glob,Grep"
          prompt: |
            Review PR #${{ github.event.pull_request.number }} in ${{ github.repository }}.

            ## Project context

            This is the NLDD Design System — a library of vanilla Web Components for the
            Nederlandse Digitale Dienst (Rijksoverheid). Components are built with Lit +
            TypeScript and documented in Storybook.

            **Key architecture:**
            - `src/components/` — Lit + TypeScript web components using Shadow DOM
            - `src/assets/styles/variables.css` — the CSS variables (primitives, semantics, components)
            - Components follow BEM naming, use CSS variables (never hardcoded values)
            - Must be DigiToegankelijk (WCAG 2.1 AA) compliant
            - Uses RijksSansVF font with system-ui fallback

            **CSS variable hierarchy:**
            - `--primitives-*` → base values (colors, spacing)
            - `--semantics-*` → meaningful variables (buttons, controls)
            - `--components-*` → component-specific variables

            ## Review dimensions

            Review the PR diff across these dimensions. Only comment on changed lines.
            Skip dimensions that have no findings. Be precise and actionable.

            ### 1. Component correctness

            - Does the component extend LitElement correctly?
            - Is Shadow DOM used properly?
            - Are properties/attributes declared and reflected correctly?
            - Are slots, events, and lifecycle hooks used appropriately?
            - No hardcoded values — all styling via CSS variables.

            ### 2. Accessibility (WCAG 2.1 AA)

            - Proper ARIA attributes and roles?
            - Keyboard navigation support?
            - Focus management and visible focus indicators?
            - Color contrast meets AA requirements?
            - Screen reader compatibility?

            ### 3. CSS variable usage

            - Are semantic variables preferred over primitives? The order is
              components → semantics → primitives.
            - No fallback values on `--primitives-*`, `--semantics-*` or `--components-*`:
              those are validated against variables.css and a fallback hides a missing one.
              `--context-*` is the exception and takes a fallback by design, because the
              component it comes from may not be there.
            - Context hooks use `--context-*` prefix?
            - Internal variables use `--_*` prefix, declared at the top of `:host` and read
              as a bare `var(--_x)` in the rules?

            ### 4. CSS and styling

            - BEM naming convention followed?
            - `!important` only where a consumer reset would otherwise win, with a comment
              saying so. It is used deliberately in a handful of components, so flag a new
              one without a reason rather than every occurrence.
            - Asymmetric padding matches design specs?
            - Disabled states use `var(--primitives-opacity-disabled)`?

            ### 5. Testing

            - Smoke tests present for new components?
            - Complex logic has unit tests?
            - Tests use project test utilities (fixture, cleanup, waitForUpdate)?

            ### 6. General code quality

            - TypeScript types correct and complete?
            - No security vulnerabilities (XSS in Shadow DOM, etc.)?
            - Conventional commit messages used, and a consumer-facing change written up in
              CHANGELOG.md by hand?
            - No unnecessary dependencies or file bloat?

            ## Output format

            You MUST publish your review as a PR comment by calling the
            mcp__github_comment__update_claude_comment tool. Your final answer text is
            discarded — a review that is not posted with that tool does not exist.
            ALWAYS post the comment, on every run, including when you find no issues:
            in that case post a brief comment stating what you reviewed and that you
            found no issues.

            Structure the comment with sections for each dimension that has
            findings. Use this severity scale:

            - 🔴 **Critical** — broken component, accessibility failure, security issue
            - 🟠 **Significant** — likely bug, missing token, broken pattern
            - 🟡 **Minor** — code quality, style, non-blocking improvement

            Also leave inline comments on specific lines where possible, using
            mcp__github_inline_comment__create_inline_comment.

            Do not pad the review with praise or filler.
