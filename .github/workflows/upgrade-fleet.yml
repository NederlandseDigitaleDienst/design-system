name: Upgrade the fleet

# After a release is on npm, brings every repository on the list to it, each
# with a pull request of its own. The work per repository is upgrade.yml.
#
# The list is not in this repository: which apps use the design system is
# theirs to tell. Everything this workflow needs is a variable or a secret of
# this repository, and without the list it does nothing:
#
#   NLDD_FLEET                  variable   the list, a JSON array. An entry is owner/name, or
#                                          { "repository", "build", "site", "sandbox" }: the
#                                          command that builds a site on a plain runner and
#                                          the directory it writes to, for pictures, and
#                                          `false` to run the agent without a sandbox
#   NLDD_FLEET_APP_CLIENT_ID    variable   the GitHub App that opens the pull requests,
#   NLDD_FLEET_APP_KEY          secret     and its private key
#   NLDD_FLEET_TOKEN            secret     or, without an app, a token of a bot account
#   NLDD_FLEET_AGENT            variable   a JSON array of owner/name: there an agent works the
#                                          list of what is left. It runs commands in that
#                                          repository, so name the ones whose content you trust
#   CLAUDE_CODE_OAUTH_TOKEN     secret     for the agent, or
#   ANTHROPIC_API_KEY           secret     an API key
#
# The app is installed once per organization, by an owner who picks the
# repositories. A repository on the list where it is not installed fails on its
# own and holds up no other.
#
# Run by hand, it takes one repository that need not be on the list, and a
# branch of this repository to take the command from: that is how a change to
# the command is tried on a real app before its release.

on:
  workflow_run:
    workflows: ['Publish to npmjs']
    types: [completed]
  workflow_dispatch:
    inputs:
      repository:
        description: 'Only this repository, owner/name. Default: the whole list.'
        type: string
        default: ''
      version:
        description: 'The version to upgrade to. Default: the latest on npm.'
        type: string
        default: latest
      agent:
        description: 'Let an agent work the list of what is left.'
        type: choice
        options: ['as set in NLDD_FLEET_AGENT', 'yes', 'no']
        default: 'as set in NLDD_FLEET_AGENT'
      tool_ref:
        description: 'Take the command from this branch or tag of this repository, not from npm.'
        type: string
        default: ''

permissions:
  contents: read

jobs:
  upgrade:
    if: >-
      (inputs.repository != '' || vars.NLDD_FLEET != '') &&
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    strategy:
      fail-fast: false
      # A few at a time: a release that breaks something shows in the first pull requests.
      max-parallel: 3
      matrix:
        target: ${{ fromJSON(inputs.repository && format('["{0}"]', inputs.repository) || vars.NLDD_FLEET) }}
    uses: ./.github/workflows/upgrade.yml
    permissions:
      contents: write
      pull-requests: write
    with:
      repository: ${{ matrix.target.repository || matrix.target }}
      version: ${{ inputs.version || 'latest' }}
      agent: ${{ inputs.agent == 'yes' || (inputs.agent != 'no' && contains(fromJSON(vars.NLDD_FLEET_AGENT || '[]'), matrix.target.repository || matrix.target)) }}
      sandbox: ${{ matrix.target.sandbox != false }}
      build: ${{ matrix.target.build }}
      site: ${{ matrix.target.site }}
      app_client_id: ${{ vars.NLDD_FLEET_APP_CLIENT_ID }}
      tool_ref: ${{ inputs.tool_ref }}
    secrets:
      token: ${{ secrets.NLDD_FLEET_TOKEN }}
      app_private_key: ${{ secrets.NLDD_FLEET_APP_KEY }}
      claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
