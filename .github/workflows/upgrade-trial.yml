name: Try the upgrade (temporary)

# Temporary, and removed before this branch is merged. upgrade-fleet.yml can
# only be started by hand once it is on main, so this starts the same job from
# the branch: the app opens the pull request, the agent works the list, and the
# command comes from this branch. The repositories are in a variable, like the
# list of the fleet. A push that touches this file starts it. Third run.

on:
  push:
    branches: [feat/upgrade-rounds]
    paths: ['.github/workflows/upgrade-trial.yml']

permissions:
  contents: read

jobs:
  upgrade:
    if: vars.NLDD_FLEET_TRIAL != ''
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(vars.NLDD_FLEET_TRIAL) }}
    uses: ./.github/workflows/upgrade.yml
    permissions:
      contents: write
      pull-requests: write
    with:
      repository: ${{ matrix.target.repository || matrix.target }}
      agent: true
      build: ${{ matrix.target.build }}
      site: ${{ matrix.target.site }}
      app_client_id: ${{ vars.NLDD_FLEET_APP_CLIENT_ID }}
      tool_ref: feat/upgrade-rounds
    secrets:
      app_private_key: ${{ secrets.NLDD_FLEET_APP_KEY }}
      claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
