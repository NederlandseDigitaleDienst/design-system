# Rootless nginx (nginxinc/nginx-unprivileged) serves the static Vite build.
server {
    listen       8080;
    listen       [::]:8080;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/css
        text/plain
        text/xml
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # TLS ends at the ZAD ingress. Relative redirects keep its host name and
    # https instead of leaking the internal port 8080.
    absolute_redirect off;
    port_in_redirect off;

    # The page itself revalidates, so a new image shows up on the next load.
    location / {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }

    # Vite puts a content hash in every file name under assets/, so a file
    # there never changes and can be cached for good.
    location /assets/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
