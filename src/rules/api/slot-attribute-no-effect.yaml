  nldd-button[end-icon]:has(> [slot="end-icon"]),
  nldd-icon-button[icon]:has(> [slot="icon"]),
  nldd-menu-item[icon]:has(> [slot="icon"]),
  nldd-toggle-button[icon]:has(> [slot="icon"]),
