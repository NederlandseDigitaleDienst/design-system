    - '<nldd-token text="Dakisolatie"></nldd-token>'
  failed:
    - '<nldd-button text="Opslaan"><span slot="text">Opslaan</span></nldd-button>'
    - '<nldd-tab-bar-item text="Aanvraag A-1042" icon="star"><img slot="icon" alt=""></nldd-tab-bar-item>'
    - '<nldd-icon-cell icon="star"><img alt=""></nldd-icon-cell>'
