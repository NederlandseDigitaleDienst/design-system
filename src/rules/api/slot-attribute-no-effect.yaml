  nldd-tag[icon]:has(> [slot="icon"]),
  nldd-link[start-icon]:has(> [slot="start-icon"]),
  nldd-link[end-icon]:has(> [slot="end-icon"]),
  nldd-tab-bar-item[icon]:has(> [slot="icon"]),
  nldd-menu-bar-item[icon]:has(> [slot="icon"]),
