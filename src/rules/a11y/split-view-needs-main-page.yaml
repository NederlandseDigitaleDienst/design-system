severity: warn
context: 'nldd-navigation-split-view:has(nldd-page)'
assert: ':has(nldd-page[landmarks="page"])'
message: 'Set landmarks="page" on the page in the pane with the main content, or the screen offers no main landmark or two.'
see: patronen/application
examples:
  passed: ['<nldd-navigation-split-view><nldd-page slot="main" landmarks="page"></nldd-page></nldd-navigation-split-view>']
  failed: ['<nldd-navigation-split-view><nldd-page slot="main"></nldd-page></nldd-navigation-split-view>']
  cantTell: ['<nldd-navigation-split-view><nldd-page slot="main" :landmarks="soort"></nldd-page></nldd-navigation-split-view>']
