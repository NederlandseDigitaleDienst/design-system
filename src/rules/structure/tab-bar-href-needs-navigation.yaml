severity: warn
context: 'nldd-tab-bar:not([navigation]):is(:has(nldd-tab-bar-item[href]), :state(link-tabs))'
message: 'Tabs with `href` go to another page: add `navigation`, so the bar is a nav with aria-current="page" instead of a tablist, and set `current` on the tab of the page you are on.'
examples:
  passed: ['<nldd-tab-bar navigation accessible-label="Secties"><nldd-tab-bar-item href="/a" text="A"></nldd-tab-bar-item></nldd-tab-bar>']
  failed: ['<nldd-tab-bar accessible-label="Secties"><nldd-tab-bar-item href="/a" text="A"></nldd-tab-bar-item></nldd-tab-bar>']
