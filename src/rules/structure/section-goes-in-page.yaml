severity: warn
context: ':page-section'
assert: 'nldd-page *'
message: 'Put this section in an nldd-page: a section lays out by the width of the page, and the page makes its content the main landmark, scrolls it and tells sticky content where the bars are.'
see: patronen/page-structure
examples:
  passed: ['<html><body><nldd-page><nldd-simple-section><nldd-text>Inhoud</nldd-text></nldd-simple-section></nldd-page></body></html>', '<html><body><nldd-page><div slot="header"><nldd-hero></nldd-hero></div></nldd-page></body></html>', '<html><body><nldd-sheet><nldd-page><nldd-simple-section></nldd-simple-section></nldd-page></nldd-sheet></body></html>']
  failed: ['<html><body><nldd-simple-section><nldd-text>Inhoud</nldd-text></nldd-simple-section></body></html>', '<html><body><nldd-shell><nldd-sidebar-section></nldd-sidebar-section></nldd-shell></body></html>', '<html><body><nldd-sheet><nldd-simple-section></nldd-simple-section></nldd-sheet></body></html>']
  cantTell: ['<nldd-simple-section></nldd-simple-section>']
