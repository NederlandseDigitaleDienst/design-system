severity: warn
context: 'nldd-link'
assert: '[href], :has(> a:not([slot])[href])'
message: 'Give it an `href`, or the `<a>` in it one, or use nldd-button when it performs an action: what looks like a link has to be one.'
see: ontwerprichtlijnen/visueel-en-layout
examples:
  passed:
    - '<nldd-link href="/a" text="Aanvraag A-1042"></nldd-link>'
    - '<nldd-link><a href="/a">Aanvraag A-1042</a></nldd-link>'
  failed:
    - '<nldd-link text="Aanvraag A-1042"></nldd-link>'
    - '<nldd-link><a>Aanvraag A-1042</a></nldd-link>'
  cantTell: ['<nldd-link :href="url" text="Aanvraag A-1042"></nldd-link>']
