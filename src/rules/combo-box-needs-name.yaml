severity: error
context: 'nldd-combo-box'
assert: '[accessible-label], nldd-form-field[label] *'
message: 'nldd-combo-box needs `accessible-label` or a labeled nldd-form-field around it, or it has no accessible name.'
see: patronen/form
examples:
  passed: ['<nldd-combo-box accessible-label="Team"></nldd-combo-box>', '<nldd-form-field label="Team"><nldd-combo-box></nldd-combo-box></nldd-form-field>']
  failed: ['<html><body><nldd-combo-box></nldd-combo-box></body></html>']
  cantTell: ['<nldd-combo-box></nldd-combo-box>']
