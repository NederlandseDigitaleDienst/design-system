severity: hint
context: 'nldd-menu[anchor]:not(nldd-table ~ nldd-menu, button ~ nldd-menu)'
message: 'Nest it in the `popup` slot of the button, or point `popovertarget` on the button or list segment at its id: both anchor it and open it. `anchor` is for a trigger that is not an nldd component.'
see: patronen/menu-from-a-button
