severity: error
context: 'nldd-code-editor, nldd-text-editor'
assert: '[accessible-label], [input-id], nldd-form-field[label] *'
message: 'An editor needs `accessible-label`, `input-id` or a labeled nldd-form-field around it, or it has no accessible name (WCAG SC 4.1.2).'
see: patronen/form
examples:
  passed: ['<nldd-code-editor accessible-label="Regel"></nldd-code-editor>', '<nldd-form-field label="Toelichting"><nldd-text-editor></nldd-text-editor></nldd-form-field>']
  failed: ['<html><body><nldd-code-editor></nldd-code-editor></body></html>', '<html><body><nldd-text-editor></nldd-text-editor></body></html>']
  cantTell: ['<nldd-text-editor></nldd-text-editor>']
