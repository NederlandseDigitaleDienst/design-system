<nldd-shell>
  <nldd-page>
    <nldd-simple-section>
      <nldd-title
        slot="header"
        size="1"
        text="Aanvraag intrekken"
        heading-level="1"
      ></nldd-title>
      <nldd-rich-text>
        <p>Zolang een aanvraag nog in behandeling is, kun je hem intrekken. Je hoeft daar geen reden voor te geven.</p>
      </nldd-rich-text>
    </nldd-simple-section>

    <nldd-page-footer slot="footer">
      <nldd-breadcrumbs slot="breadcrumbs">
        <nldd-breadcrumbs-item
          text="Home"
          href="#home"
        ></nldd-breadcrumbs-item>
        <nldd-breadcrumbs-item
          text="Aanvragen"
          href="#aanvragen"
        ></nldd-breadcrumbs-item>
        <nldd-breadcrumbs-item
          text="Aanvraag intrekken"
          current
        ></nldd-breadcrumbs-item>
      </nldd-breadcrumbs>
      <nldd-container
        layout="grid"
        sm-column-count="2"
        md-column-count="2"
        lg-column-count="3"
        gap="24"
      >
        <nldd-container gap="8">
          <nldd-title
            size="5"
            text="Aanvragen"
            heading-level="2"
          ></nldd-title>
          <nldd-link-group
            orientation="vertical"
            accessible-label="Aanvragen"
          >
            <nldd-link
              href="#aanvraag-indienen"
              text="Aanvraag indienen"
            ></nldd-link>
            <nldd-link
              href="#behandeling-volgen"
              text="Behandeling volgen"
            ></nldd-link>
            <nldd-link
              href="#bezwaar-maken"
              text="Bezwaar maken"
            ></nldd-link>
          </nldd-link-group>
        </nldd-container>
        <nldd-container gap="8">
          <nldd-title
            size="5"
            text="Onderwerpen"
            heading-level="2"
          ></nldd-title>
          <nldd-link-group
            orientation="vertical"
            accessible-label="Onderwerpen"
          >
            <nldd-link
              href="#isoleren"
              text="Isoleren"
            ></nldd-link>
            <nldd-link
              href="#warmtepomp"
              text="Warmtepomp"
            ></nldd-link>
            <nldd-link
              href="#energie-besparen"
              text="Energie besparen"
            ></nldd-link>
          </nldd-link-group>
        </nldd-container>
        <nldd-container gap="8">
          <nldd-title
            size="5"
            text="Mijn Dienst"
            heading-level="2"
          ></nldd-title>
          <nldd-link-group
            orientation="vertical"
            accessible-label="Mijn Dienst"
          >
            <nldd-link
              href="#dossier"
              text="Zo werkt je dossier"
            ></nldd-link>
            <nldd-link
              href="#contact"
              text="Contact opnemen"
            ></nldd-link>
          </nldd-link-group>
        </nldd-container>
      </nldd-container>
      <nldd-page-footer-legal-bar slot="legal-bar">
        <nldd-page-footer-legal-bar-item
          slot="start"
          text="Nederlandse Digitale Dienst"
        ></nldd-page-footer-legal-bar-item>
        <nldd-page-footer-legal-bar-item
          slot="end"
          href="#contact"
          text="Contact"
        ></nldd-page-footer-legal-bar-item>
        <nldd-page-footer-legal-bar-item
          slot="end"
          href="#toegankelijkheid"
          text="Toegankelijkheid"
        ></nldd-page-footer-legal-bar-item>
        <nldd-page-footer-legal-bar-item
          slot="end"
          href="#privacy"
          text="Privacy"
        ></nldd-page-footer-legal-bar-item>
        <nldd-page-footer-legal-bar-item
          slot="end"
          href="#over-deze-website"
          text="Over deze website"
        ></nldd-page-footer-legal-bar-item>
      </nldd-page-footer-legal-bar>
    </nldd-page-footer>
  </nldd-page>
</nldd-shell>
