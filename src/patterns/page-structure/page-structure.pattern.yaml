partial:
  page-structure.header.html: [nldd-page-footer]
  page-structure.header-account.html: [nldd-page-footer]
  page-structure.header-home.html: [nldd-page-footer]
  page-structure.header-login.html: [nldd-page-footer]
  page-structure.header-status.html: [nldd-page-footer]
  page-structure.footer.html: ['slot="header"']
  page-structure.footer-home.html: ['slot="header"']
composition:
  - tag: nldd-shell
    note: de buitenste schil
    children:
      - tag: nldd-page
        children:
          - slot: header
            note: de header
            children:
              - tag: nldd-status-bar
                optional: true
                note: alleen als er iets te melden is, boven de balk
              - tag: nldd-skip-link
                note: om de balk heen
                children:
                  - tag: nldd-top-navigation-bar
                    attrs: [website-title, back-text, back-href]
                    children:
                      - tag: nldd-menu-bar
                        optional: true
                        slot: utility
                        note: zoeken en taal
          - tag: nldd-simple-section
            note: één sectie per inhoudsblok, met de h1 in de eerste
          - tag: nldd-simple-section
            optional: true
            attrs: ['background="tinted"']
            note: een vlak
          - tag: nldd-page-footer
            slot: footer
            note: de footer
            children:
              - tag: nldd-breadcrumbs
                optional: true
                slot: breadcrumbs
                note: waar deze pagina staat
              - tag: nldd-container
                optional: true
                note: de hoofdinhoud, vrij in te vullen
              - tag: nldd-page-footer-legal-bar
                slot: legal-bar
