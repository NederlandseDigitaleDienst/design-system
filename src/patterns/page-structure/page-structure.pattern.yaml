examples:
  page-structure.header.html: page-header
  page-structure.header-account.html: page-header
  page-structure.header-home.html: page-header
  page-structure.header-login.html: page-header
  page-structure.header-status.html: page-header
  page-structure.footer.html: page-footer
  page-structure.footer-home.html: page-footer

composition:
  - tag: nldd-shell
    note: de buitenste schil
    children:
      - tag: nldd-page
        children:
          - ref: page-header
            note: de header; de balk krijgt website-title, en back-text en back-href waar dat kan
          - tag: nldd-simple-section
            note: één sectie per inhoudsblok, met de h1 in de eerste
          - tag: nldd-simple-section
            optional: true
            attrs: ['background="tinted"']
            note: een vlak
          - ref: page-footer
