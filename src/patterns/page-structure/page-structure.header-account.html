<nldd-shell>
  <nldd-page>
    <nldd-skip-link slot="header">
      <nldd-top-navigation-bar
        website-title="Mijn Dienst"
        back-text="Aanvragen"
        back-href="#aanvragen"
      >
        <nldd-menu-bar slot="utility">
          <nldd-menu-bar-item
            text="Zoeken"
            icon="magnifier"
            href="#zoeken"
            content-priority="text"
          ></nldd-menu-bar-item>
          <nldd-menu-bar-item
            text="NL"
            accessible-label="Taal: Nederlands (NL)"
            icon="globe"
            expandable
            content-priority="text"
          >
            <nldd-menu>
              <nldd-menu-item
                text="Nederlands"
                type="radio"
                selected
              ></nldd-menu-item>
              <nldd-menu-item
                text="English"
                type="radio"
                lang="en"
              ></nldd-menu-item>
            </nldd-menu>
          </nldd-menu-bar-item>
          <nldd-menu-bar-item
            text="Mijn account"
            expandable
            content-priority="icon"
          >
            <nldd-avatar
              slot="icon"
              color="inherit"
              name="Anouk de Vries"
              decorative
              icon-aligned
            ></nldd-avatar>
            <nldd-menu>
              <nldd-container
                slot="header"
                padding="16"
              >
                <nldd-identity
                  text="Anouk de Vries"
                  supporting-text="anouk.devries@example.com"
                >
                  <nldd-avatar
                    slot="avatars"
                    name="Anouk de Vries"
                    decorative
                  ></nldd-avatar>
                </nldd-identity>
              </nldd-container>
              <nldd-menu-item
                text="Dossier"
                icon="folder"
                href="#dossier"
              ></nldd-menu-item>
              <nldd-menu-item
                text="Profiel"
                icon="profile"
                href="#profiel"
              ></nldd-menu-item>
              <nldd-menu-divider></nldd-menu-divider>
              <nldd-menu-item
                text="Log uit"
                icon="logout"
              ></nldd-menu-item>
            </nldd-menu>
          </nldd-menu-bar-item>
        </nldd-menu-bar>
      </nldd-top-navigation-bar>
    </nldd-skip-link>

    <nldd-simple-section>
      <nldd-title
        slot="header"
        size="1"
        text="Aanvraag intrekken"
        heading-level="1"
      ></nldd-title>
      <nldd-rich-text>
        <p>Zolang een aanvraag nog in behandeling is, kun je hem intrekken. Je hoeft daar geen reden voor te geven.</p>
      </nldd-rich-text>
    </nldd-simple-section>
  </nldd-page>
</nldd-shell>
