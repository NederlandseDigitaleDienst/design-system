<nldd-shell>
  <nldd-page>
    <nldd-skip-link slot="header">
      <nldd-top-navigation-bar
        website-title="Mijn Dienst"
      >
        <nldd-menu-bar slot="utility">
          <nldd-menu-bar-item
            text="Zoeken"
            icon="magnifier"
            href="#zoeken"
            content-priority="text"
          ></nldd-menu-bar-item>
          <nldd-menu-bar-item
            text="NL"
            accessible-label="Taal: Nederlands (NL)"
            icon="globe"
            expandable
            content-priority="text"
          >
            <nldd-menu>
              <nldd-menu-item
                text="Nederlands"
                type="radio"
                selected
              ></nldd-menu-item>
              <nldd-menu-item
                text="English"
                type="radio"
                lang="en"
              ></nldd-menu-item>
              <nldd-menu-item
                text="Frysk"
                type="radio"
                lang="fy"
              ></nldd-menu-item>
              <nldd-menu-item
                text="Papiamento"
                type="radio"
                lang="pap-AW"
              ></nldd-menu-item>
              <nldd-menu-item
                text="Papiamentu"
                type="radio"
                lang="pap-CW"
              ></nldd-menu-item>
            </nldd-menu>
          </nldd-menu-bar-item>
        </nldd-menu-bar>
      </nldd-top-navigation-bar>
    </nldd-skip-link>

    <nldd-simple-section>
      <nldd-title
        slot="header"
        size="1"
        text="Regel je aanvraag online"
        heading-level="1"
      ></nldd-title>
      <nldd-rich-text>
        <p>Dien een aanvraag in, volg de behandeling en vind je documenten terug.</p>
      </nldd-rich-text>
    </nldd-simple-section>
  </nldd-page>
</nldd-shell>
