composition:
  - tag: nldd-shell
    note: de buitenste schil
    children:
      - tag: nldd-page
        children:
          - label: slot="header"
            note: de header
            children:
              - tag: nldd-skip-link
                note: om de balk heen
                children:
                  - tag: nldd-top-navigation-bar
                    note: zoeken en taal, terug naar de onderwerpen
          - tag: nldd-hero
            note: de h1, een korte uitleg en de hoofdtaak
            children:
              - label: slot="media"
                note: nldd-image, hier nog zonder beeld
          - tag: nldd-one-half-one-half-section
            note: tekst links, afbeelding rechts
            children:
              - label: slot="left"
                note: titel, tekst en een nldd-link verder
              - tag: nldd-image
                attrs: ['slot="right"', aspect-ratio]
          - tag: nldd-simple-section
            attrs: ['background="tinted"']
            note: wat je moet weten
            children:
              - label: slot="header"
                note: de titel en een intro van een zin of twee
              - tag: nldd-collection
                children:
                  - tag: nldd-card
                    attrs: [href]
                    note: naar pagina's waar ze ook staan
          - tag: nldd-one-third-two-thirds-section
            children:
              - label: slot="left"
                note: de titel en een korte uitleg
              - tag: nldd-list
                attrs: ['slot="right"', 'type="navigation"']
                note: naar de pagina's eronder
          - tag: nldd-simple-section
            attrs: ['background="tinted"']
            note: verwante onderwerpen
            children:
              - tag: nldd-collection
                children:
                  - tag: nldd-card
                    attrs: [href]
                    note: naar het andere onderwerp
          - tag: nldd-page-footer
            attrs: ['slot="footer"']
            children:
              - label: slot="breadcrumbs"
              - label: slot="legal-bar"
