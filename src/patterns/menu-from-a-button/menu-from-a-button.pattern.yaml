composition:
  - tag: nldd-button
    attrs: [expandable]
    note: of nldd-icon-button
    children:
      - tag: nldd-menu
        attrs: ['slot="popup"']
        children:
          - tag: nldd-menu-item
            attrs: [text, icon, shortcut, href]
          - tag: nldd-menu-divider
            optional: true
          - tag: nldd-menu-group
            optional: true
            attrs: [text]
            note: een kopje boven een groep items
