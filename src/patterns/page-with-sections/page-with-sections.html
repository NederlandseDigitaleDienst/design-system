<nldd-app-view>
  <nldd-page>
    <nldd-top-navigation-bar
      slot="header"
      website-title="Mijn Dienst"
    ></nldd-top-navigation-bar>

    <nldd-simple-section>
      <nldd-title
        slot="header"
        size="1"
        overline="Dossier"
        text="Aanvraag 2024-001"
        heading-level="1"
      >
        <nldd-button
          slot="end"
          variant="primary"
          text="Nieuwe aanvraag"
        ></nldd-button>
      </nldd-title>
      <nldd-rich-text>
        <p>Een korte inleiding op deze pagina.</p>
      </nldd-rich-text>
    </nldd-simple-section>

    <nldd-simple-section background="tinted">
      <nldd-title
        slot="header"
        size="2"
        text="Openstaande taken"
        heading-level="2"
      ></nldd-title>
      <nldd-list
        variant="box-base"
        accessible-label="Openstaande taken"
      >
        <nldd-list-item href="#documenten-controleren">
          <nldd-text-cell
            text="Documenten controleren"
            supporting-text="Voor vrijdag"
          ></nldd-text-cell>
        </nldd-list-item>
        <nldd-list-item href="#besluit-versturen">
          <nldd-text-cell
            text="Besluit versturen"
            supporting-text="Na goedkeuring"
          ></nldd-text-cell>
        </nldd-list-item>
      </nldd-list>
    </nldd-simple-section>
  </nldd-page>
</nldd-app-view>
