<nldd-list
  type="tree"
  accessible-label="Dossiers per team"
>
  <nldd-list-item expanded>
    <nldd-list-item-segment
      button
      disclosure
      accessible-label="Team Uitvoering"
    >
      <nldd-icon-cell
        size="20"
        color="secondary"
        icon="chevron-right"
        disclosure
        divider-start
      ></nldd-icon-cell>
    </nldd-list-item-segment>
    <nldd-list-item-segment
      href="#team-uitvoering"
      width="full"
    >
      <nldd-text-cell text="Team Uitvoering"></nldd-text-cell>
    </nldd-list-item-segment>

    <nldd-list-item
      slot="children"
      href="#dossier-d-318"
    >
      <nldd-spacer-cell size="44"></nldd-spacer-cell>
      <nldd-spacer-cell
        size="8"
        divider-start
      ></nldd-spacer-cell>
      <nldd-icon-cell icon="document"></nldd-icon-cell>
      <nldd-spacer-cell size="8"></nldd-spacer-cell>
      <nldd-text-cell text="Dossier D-318"></nldd-text-cell>
    </nldd-list-item>
  </nldd-list-item>

  <nldd-list-item>
    <nldd-list-item-segment
      button
      disclosure
      accessible-label="Team Beleid"
    >
      <nldd-icon-cell
        size="20"
        color="secondary"
        icon="chevron-right"
        disclosure
        divider-start
      ></nldd-icon-cell>
    </nldd-list-item-segment>
    <nldd-list-item-segment
      href="#team-beleid"
      width="full"
    >
      <nldd-text-cell text="Team Beleid"></nldd-text-cell>
    </nldd-list-item-segment>

    <nldd-list-item
      slot="children"
      href="#dossier-d-319"
    >
      <nldd-spacer-cell size="44"></nldd-spacer-cell>
      <nldd-spacer-cell
        size="8"
        divider-start
      ></nldd-spacer-cell>
      <nldd-icon-cell icon="document"></nldd-icon-cell>
      <nldd-spacer-cell size="8"></nldd-spacer-cell>
      <nldd-text-cell text="Dossier D-319"></nldd-text-cell>
    </nldd-list-item>
  </nldd-list-item>
</nldd-list>
