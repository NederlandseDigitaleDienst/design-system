<nldd-page>
  <nldd-simple-section>
    <nldd-title
      slot="header"
      size="display-2"
      text="Aanvragen"
      heading-level="1"
    ></nldd-title>
    <nldd-list
      appearance="box-base"
      accessible-label="Aanvragen"
    >
      <nldd-list-item button>
        <nldd-text-cell
          text="Aanvraag A-1042"
          supporting-text="Dakisolatie, in behandeling"
        ></nldd-text-cell>
        <nldd-spacer-cell size="12"></nldd-spacer-cell>
        <nldd-icon-cell
          size="20"
          color="secondary"
          icon="chevron-right"
        ></nldd-icon-cell>
      </nldd-list-item>
    </nldd-list>
  </nldd-simple-section>
</nldd-page>

<nldd-sheet
  placement="right"
  width="480px"
>
  <nldd-page
    id="aanvraag"
    sticky-header
  >
    <nldd-top-title-bar
      slot="header"
      text="Aanvraag A-1042 bewerken"
      dismiss-text="Annuleer"
      collapse-anchor="aanvraag-titel"
    ></nldd-top-title-bar>
    <nldd-simple-section>
      <nldd-title
        id="aanvraag-titel"
        slot="header"
        size="display-2"
        text="Aanvraag A-1042 bewerken"
        heading-level="1"
      ></nldd-title>
      <nldd-form name="aanvraag">
        <nldd-form-field label="Titel">
          <nldd-text-field
            name="titel"
            value="Dakisolatie"
          ></nldd-text-field>
        </nldd-form-field>
        <nldd-list
          appearance="box-base"
          accessible-label="Behandeling"
        >
          <nldd-list-item
            id="team-kiezen"
            button
          >
            <nldd-text-cell
              text="Team"
              supporting-text="Uitvoering"
            ></nldd-text-cell>
            <nldd-spacer-cell size="12"></nldd-spacer-cell>
            <nldd-icon-cell
              size="20"
              color="secondary"
              icon="chevron-right"
            ></nldd-icon-cell>
          </nldd-list-item>
        </nldd-list>
        <nldd-form-actions>
          <nldd-button-group>
            <nldd-button
              appearance="primary"
              type="submit"
              text="Bewaar"
            ></nldd-button>
          </nldd-button-group>
        </nldd-form-actions>
      </nldd-form>
    </nldd-simple-section>
  </nldd-page>
  <nldd-page
    id="team"
    parent="aanvraag"
    sticky-header
    hidden
  >
    <nldd-top-title-bar
      slot="header"
      text="Team kiezen"
      dismiss-text="Annuleer"
      collapse-anchor="team-titel"
    ></nldd-top-title-bar>
    <nldd-simple-section>
      <nldd-title
        id="team-titel"
        slot="header"
        size="display-2"
        text="Team kiezen"
        heading-level="1"
      ></nldd-title>
      <nldd-list
        appearance="box-base"
        accessible-label="Teams"
      >
        <nldd-list-item
          button
          selected
        >
          <nldd-text-cell text="Uitvoering"></nldd-text-cell>
        </nldd-list-item>
        <nldd-list-item button>
          <nldd-text-cell text="Beleid"></nldd-text-cell>
        </nldd-list-item>
      </nldd-list>
    </nldd-simple-section>
  </nldd-page>
</nldd-sheet>
