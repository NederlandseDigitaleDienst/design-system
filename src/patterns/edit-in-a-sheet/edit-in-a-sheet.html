<nldd-button
  id="aanvraag-bewerken"
  variant="primary"
  text="Bewerk aanvraag"
></nldd-button>

<nldd-sheet
  placement="right"
  width="480px"
>
  <nldd-page sticky-footer>
    <nldd-top-title-bar
      slot="header"
      text="Aanvraag bewerken"
      dismiss-text="Sluiten"
    ></nldd-top-title-bar>

    <nldd-simple-section>
      <nldd-form name="aanvraag">
        <nldd-form-field label="Titel">
          <nldd-text-field name="titel"></nldd-text-field>
        </nldd-form-field>
        <nldd-form-field
          label="Toelichting"
          optional
        >
          <nldd-multi-line-text-field name="toelichting"></nldd-multi-line-text-field>
        </nldd-form-field>
      </nldd-form>
    </nldd-simple-section>

    <nldd-container
      slot="footer"
      padding="16"
    >
      <nldd-button
        variant="primary"
        text="Bewaar"
        width="full"
      ></nldd-button>
    </nldd-container>
  </nldd-page>
</nldd-sheet>
