<nldd-toolbar>
  <nldd-toolbar-item slot="start"
    priority="1"
  >
    <nldd-button variant="primary"
      text="Nieuw document"
      start-icon="add"
    ></nldd-button>
    <nldd-menu-item slot="overflow"
      text="Nieuw document"
      icon="add"
    ></nldd-menu-item>
  </nldd-toolbar-item>

  <nldd-toolbar-item slot="start">
    <nldd-button variant="secondary"
      text="Filter"
      start-icon="filter"
    ></nldd-button>
    <nldd-menu-item slot="overflow"
      text="Filter"
      icon="filter"
    ></nldd-menu-item>
  </nldd-toolbar-item>

  <nldd-toolbar-item slot="end">
    <nldd-icon-button icon="settings"
      text="Instellingen"
    ></nldd-icon-button>
    <nldd-menu-item slot="overflow"
      text="Instellingen"
      icon="settings"
    ></nldd-menu-item>
  </nldd-toolbar-item>
</nldd-toolbar>
