composition:
  - tag: nldd-toolbar
    attrs: [size, accessible-label]
    children:
      - tag: nldd-toolbar-item
        slot: [start, center, end]
        attrs: [priority]
        children:
          - label: de control
            any-of: [nldd-button, nldd-icon-button, nldd-search-field]
          - tag: nldd-menu-item
            optional: true
            slot: overflow
            note: dezelfde actie in het menu
      - slot: overflow
        optional: true
        any-of: [nldd-menu-item, nldd-menu-group]
        note: acties die altijd in het menu staan
