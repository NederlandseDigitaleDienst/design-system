composition:
  - tag: nldd-toolbar
    attrs: [size, accessible-label]
    children:
      - tag: nldd-toolbar-item
        attrs: [priority]
        note: slot="start" | "center" | "end"
        children:
          - label: de control
            any-of: [nldd-button, nldd-icon-button, nldd-search-field]
          - tag: nldd-menu-item
            optional: true
            attrs: ['slot="overflow"']
            note: dezelfde actie in het menu
      - tag: nldd-menu-item
        optional: true
        attrs: ['slot="overflow"']
        note: acties die altijd in het menu staan
