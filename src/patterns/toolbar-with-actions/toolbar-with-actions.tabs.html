<nldd-toolbar>
  <nldd-toolbar-item slot="start"
    priority="2"
  >
    <nldd-tab-bar accessible-label="Weergave">
      <nldd-tab-bar-item text="Overzicht"
        current
      ></nldd-tab-bar-item>
      <nldd-tab-bar-item text="Tijdlijn"></nldd-tab-bar-item>
      <nldd-tab-bar-item text="Documenten"></nldd-tab-bar-item>
    </nldd-tab-bar>
    <nldd-menu-group slot="overflow"
      text="Weergave"
    >
      <nldd-menu-item type="radio"
        text="Overzicht"
        selected
      ></nldd-menu-item>
      <nldd-menu-item type="radio"
        text="Tijdlijn"
      ></nldd-menu-item>
      <nldd-menu-item type="radio"
        text="Documenten"
      ></nldd-menu-item>
    </nldd-menu-group>
  </nldd-toolbar-item>

  <nldd-toolbar-item slot="end">
    <nldd-button variant="secondary"
      text="Deel"
      start-icon="share"
    ></nldd-button>
    <nldd-menu-item slot="overflow"
      text="Deel"
      icon="share"
    ></nldd-menu-item>
  </nldd-toolbar-item>
</nldd-toolbar>
